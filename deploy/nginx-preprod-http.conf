server {
    listen 80;
    server_name 13.53.121.224 preprod.bbservicescharter.com;

    client_max_body_size 100m;
    large_client_header_buffers 8 64k;

    # Timeouts augmentés
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    send_timeout 120s;
    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 256k;

    location = /api/health {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 256k;
        proxy_buffering off;
        proxy_request_buffering off;
        add_header X-Accel-Buffering "no" always;

        add_header Cache-Control "private, no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # Réécrit les redirections envoyées par l'app
        proxy_redirect ~^https?://localhost:3003/(.*)$ http://preprod.bbservicescharter.com/$1;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Autres assets statiques (hors _next)
    location ~* \.(?:css|js|woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @nextjs;
    }

    location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @nextjs;
    }

    location @nextjs {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_redirect ~^https?://localhost:3003/(.*)$ http://preprod.bbservicescharter.com/$1;
    }

    # Sécurité basique
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";
}







