# Production — www.bbservicescharter.com
# PM2 écoute sur le port 3003 (ecosystem.config.cjs)
# Copier vers /etc/nginx/conf.d/bbyatchv2.conf puis : sudo nginx -t && sudo systemctl reload nginx
# Ne garder qu'UN seul vhost actif : désactiver bbyatch.conf si présent (conflit server_name / SSL).
#
# Certificats Let's Encrypt — le dossier live/ reprend le 1er -d passé à certbot.
# Sur EC2, vérifier AVANT déploiement :
#   sudo ls -la /etc/letsencrypt/live/
#   sudo grep ssl_certificate /etc/nginx/conf.d/bbyatch.conf.disabled
# Variantes courantes sur cette prod :
#   A) /etc/letsencrypt/live/bbservicescharter.com/          ← défaut ci-dessous (souvent l'ancien bbyatch.conf)
#   B) /etc/letsencrypt/live/www.bbservicescharter.com/      ← si certbot a été lancé avec -d www en premier
# Si nginx -t échoue "certificate NOT FOUND", aligner ssl_certificate sur le dossier listé par ls.

upstream bbyatch_next {
  server 127.0.0.1:3003;
  keepalive 32;
}

server {
  listen 80;
  listen 443 ssl http2;
  server_name www.bbservicescharter.com bbservicescharter.com;

  # Variante A (défaut) — remplacer par variante B si ls montre www.bbservicescharter.com
  ssl_certificate /etc/letsencrypt/live/bbservicescharter.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bbservicescharter.com/privkey.pem;
  # Variante B (décommenter et commenter A si besoin) :
  # ssl_certificate /etc/letsencrypt/live/www.bbservicescharter.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/www.bbservicescharter.com/privkey.pem;

  client_max_body_size 100m;
  large_client_header_buffers 8 64k;

  if ($scheme = http) {
    return 301 https://www.bbservicescharter.com$request_uri;
  }

  proxy_connect_timeout 60s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;
  send_timeout 60s;
  proxy_buffer_size 128k;
  proxy_buffers 8 256k;
  proxy_busy_buffers_size 256k;

  location /uploads/ {
    alias /home/ec2-user/bbyatchv2-master/public/uploads/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
    try_files $uri =404;
  }

  # Health check JSON — ne jamais pointer ELB/monitoring vers / (streaming RSC)
  location = /api/health {
    proxy_pass http://bbyatch_next;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    access_log off;
  }

  # Chunks Next.js (hash dans le nom → cache long OK)
  location /_next/static/ {
    proxy_pass http://bbyatch_next;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location /_next/image {
    proxy_pass http://bbyatch_next;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://bbyatch_next;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 256k;
    proxy_buffering off;
    proxy_request_buffering off;
    add_header X-Accel-Buffering "no" always;

    # Pages HTML : jamais en cache (évite 502/chunks obsolètes en cache navigateur)
    add_header Cache-Control "private, no-cache, no-store, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header CDN-Cache-Control "no-store" always;

    proxy_redirect ~^https?://localhost:3003/(.*)$ https://www.bbservicescharter.com/$1;
  }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}
