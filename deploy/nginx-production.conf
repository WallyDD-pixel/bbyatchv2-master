# Production — www.bbservicescharter.com
# PM2 écoute sur le port 3003 (ecosystem.config.cjs)
# Copier vers /etc/nginx/conf.d/bbyatchv2.conf puis : sudo nginx -t && sudo systemctl reload nginx

upstream bbyatch_next {
  server 127.0.0.1:3003;
  keepalive 32;
}

server {
  listen 80;
  listen 443 ssl http2;
  server_name www.bbservicescharter.com bbservicescharter.com;

  ssl_certificate /etc/letsencrypt/live/www.bbservicescharter.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.bbservicescharter.com/privkey.pem;

  client_max_body_size 100m;

  if ($scheme = http) {
    return 301 https://www.bbservicescharter.com$request_uri;
  }

  proxy_connect_timeout 60s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;
  send_timeout 60s;

  location /uploads/ {
    alias /home/ec2-user/bbyatchv2-master/public/uploads/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
    try_files $uri =404;
  }

  # Chunks Next.js (hash dans le nom → cache long OK)
  location /_next/static/ {
    proxy_pass http://bbyatch_next;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location /_next/image {
    proxy_pass http://bbyatch_next;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://bbyatch_next;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Pages HTML : jamais en cache (évite 502/chunks obsolètes en cache navigateur)
    add_header Cache-Control "private, no-cache, no-store, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header CDN-Cache-Control "no-store" always;

    proxy_redirect ~^https?://localhost:3003/(.*)$ https://www.bbservicescharter.com/$1;
  }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}
